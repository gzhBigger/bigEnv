<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="bigEnv mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2634"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ec6ff"/>
      <stop offset="1" stop-color="#4c9aff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fb2ff"/>
      <stop offset="1" stop-color="#3f8fe8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0a5"/>
      <stop offset="1" stop-color="#17a97f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#4c9aff" stroke-opacity="0.32" stroke-width="8"/>

  <!-- version stack: newest on top -->
  <rect x="112" y="150" width="288" height="58" rx="29" fill="url(#bar1)"/>
  <rect x="112" y="232" width="232" height="58" rx="29" fill="url(#bar2)"/>
  <rect x="112" y="314" width="168" height="58" rx="29" fill="url(#bar3)"/>

  <!-- active marker -->
  <circle cx="356" cy="343" r="29" fill="#35d0a5"/>
  <circle cx="356" cy="343" r="13" fill="#08111a"/>
</svg>
